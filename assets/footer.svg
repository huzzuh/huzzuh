<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 124" width="900" height="124">
  <defs>
    <linearGradient id="foot-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131312" />
      <stop offset="50%" stop-color="#171716" />
      <stop offset="100%" stop-color="#111110" />
    </linearGradient>

    <filter id="foot-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="29" result="noise" />
      <feColorMatrix type="matrix" values="
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0    0    0    0.10 0" in="noise" result="monoNoise" />
      <feComposite in="monoNoise" in2="SourceGraphic" operator="over" />
    </filter>

    <filter id="foot-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.045" numOctaves="3" seed="19" result="turb" />
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="1.9" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <rect width="900" height="124" fill="url(#foot-paper)" />
  <rect width="900" height="124" fill="#161615" opacity="0.3" filter="url(#foot-grain)" />

  
  <g filter="url(#foot-pencil)" fill="none" stroke-linecap="round">
    <rect x="24" y="14" width="852" height="96" stroke="#6E6B64" stroke-width="1.1" />
    <rect x="29" y="19" width="842" height="86" stroke="#3F3E39" stroke-width="0.7" />

    
    <line x1="14" y1="14" x2="36" y2="14" stroke="#A8A59E" stroke-width="1" />
    <line x1="24" y1="6" x2="24" y2="26" stroke="#A8A59E" stroke-width="1" />
    <line x1="864" y1="14" x2="886" y2="14" stroke="#A8A59E" stroke-width="1" />
    <line x1="876" y1="6" x2="876" y2="26" stroke="#A8A59E" stroke-width="1" />

    
    <path d="M 270 66 Q 450 64.5 630 66" stroke="#7A7770" stroke-width="1" />
  </g>

  
  <text x="450" y="54" text-anchor="middle" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="18" fill="#E6E3DC" letter-spacing="1.4">
    Thanks for dropping by — more things are on the way ✦
  </text>

  <text x="450" y="88" text-anchor="middle" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="10.5" fill="#8E8B83" letter-spacing="2">
    END OF FOLIO  ·  SYED HUZAIFA ALI (@HUZZUH)  ·  BHOPAL, INDIA
  </text>
</svg>
