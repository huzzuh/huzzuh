    <rect x="24" y="20" width="852" height="310" stroke="#7A7770" stroke-width="1.2" opacity="0.85" />
    <rect x="30" y="26" width="840" height="298" stroke="#474540" stroke-width="0.7" opacity="0.8" />

    
    <line x1="12" y1="20" x2="42" y2="20" stroke="#B5B2AA" stroke-width="1.1" />
