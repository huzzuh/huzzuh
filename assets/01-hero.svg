<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350">
  <defs>
    <style>
      .t1 { animation: ticker 12s infinite; opacity: 0; }
      .t2 { animation: ticker 12s infinite 3s; opacity: 0; }
      .t3 { animation: ticker 12s infinite 6s; opacity: 0; }
      .t4 { animation: ticker 12s infinite 9s; opacity: 0; }
      .cur { animation: blink 1s step-end infinite; }
      @keyframes ticker {
        0%, 3% { opacity: 0; }
        6%, 22% { opacity: 1; }
        25%, 100% { opacity: 0; }
      }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
    </style>

    <filter id="paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" seed="14" result="n" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.09 0" in="n" result="mn" />
      <feComposite in="mn" in2="SourceGraphic" operator="over" />
    </filter>

    <filter id="pencil" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="turbulence" baseFrequency="0.045" numOctaves="3" seed="7" result="t" />
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E1E1C" stroke-width="0.7" />
    </pattern>

    <pattern id="hatch" width="7" height="7" patternTransform="rotate(38)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#6E6B64" stroke-width="0.9" opacity="0.55" />
    </pattern>

    <linearGradient id="lead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A8780" />
      <stop offset="40%" stop-color="#EAE7DF" />
      <stop offset="80%" stop-color="#B8B4AC" />
      <stop offset="100%" stop-color="#6E6B64" />
    </linearGradient>
  </defs>

  
  <rect width="900" height="350" fill="#141413" />
  <rect x="24" y="20" width="852" height="330" fill="url(#grid)" />
  <rect width="900" height="350" fill="#141413" opacity="0.35" filter="url(#paper)" />

  
  <g filter="url(#pencil)" fill="none" stroke-linecap="round">
    
    <path d="M 24 350 L 24 20 L 876 20 L 876 350" stroke="#7A7770" stroke-width="1.2" />
    <path d="M 30 350 L 30 26 L 870 26 L 870 350" stroke="#42403B" stroke-width="0.7" />

    
    <line x1="10" y1="20" x2="40" y2="20" stroke="#BDBAB2" stroke-width="1.1" />
    <line x1="24" y1="6" x2="24" y2="38" stroke="#BDBAB2" stroke-width="1.1" />
    <line x1="860" y1="20" x2="890" y2="20" stroke="#BDBAB2" stroke-width="1.1" />
    <line x1="876" y1="6" x2="876" y2="38" stroke="#BDBAB2" stroke-width="1.1" />

    
    <line x1="30" y1="54" x2="870" y2="54" stroke="#5A5852" stroke-width="0.9" />
    <line x1="30" y1="304" x2="870" y2="304" stroke="#5A5852" stroke-width="0.9" />
    <line x1="600" y1="54" x2="600" y2="304" stroke="#3B3A36" stroke-width="0.9" stroke-dasharray="4 4" />
  </g>

  
  <g font-family="&#39;Courier New&#39;, Courier, monospace" font-size="10.5" fill="#9E9B93" letter-spacing="1.8">
    <text x="50" y="41">FOLIO NO. 01  //  GRAPHITE SKETCHBOOK</text>
    <text x="850" y="41" text-anchor="end">23.2599° N, 77.4126° E  ·  BHOPAL, IN</text>
  </g>

  
  <g>
    <text x="52" y="90" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="11" fill="#8C8982" letter-spacing="2.2">
      // AUTHORIZED DOSSIER — @HUZZUH
    </text>

    <text x="53.5" y="143.5" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="38" font-weight="bold" fill="#0A0A0A" opacity="0.75" letter-spacing="2.8">
      SYED HUZAIFA ALI
    </text>
    <text x="52" y="142" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="38" font-weight="bold" fill="#EAE7DF" letter-spacing="2.8">
      SYED HUZAIFA ALI
    </text>

    
    <g filter="url(#pencil)">
      <path d="M 52 156 Q 290 154 556 157" fill="none" stroke="url(#lead)" stroke-width="1.8" />
      <path d="M 52 162 Q 250 160.5 470 162.5" fill="none" stroke="#6E6B64" stroke-width="0.9" />
    </g>

    
    <g filter="url(#pencil)">
      <rect x="57" y="182" width="420" height="34" fill="url(#hatch)" stroke="none" />
      <rect x="52" y="177" width="420" height="34" fill="#181816" stroke="#8C8982" stroke-width="1" />
      <line x1="60" y1="177" x2="60" y2="211" stroke="#5A5852" stroke-width="0.8" />
    </g>

    <g font-family="&#39;Courier New&#39;, Courier, monospace" font-size="13" font-weight="bold" fill="#E6E3DC" letter-spacing="1.6">
      <text x="74" y="199" class="t1">▸ FRONTEND DEVELOPER <tspan class="cur">_</tspan></text>
      <text x="74" y="199" class="t2">▸ REACT + TAILWIND CSS <tspan class="cur">_</tspan></text>
      <text x="74" y="199" class="t3">▸ B.TECH CS @ SISTEC GN <tspan class="cur">_</tspan></text>
      <text x="74" y="199" class="t4">▸ BUILDING FOR THE WEB <tspan class="cur">_</tspan></text>
    </g>

    <text x="52" y="244" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="14" fill="#B8B4AC" font-style="italic">
      Crafting clean components, sensible interactions &amp; fast web interfaces.
    </text>

    <text x="52" y="274" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="11" fill="#8C8982" letter-spacing="1.2">
      MEDIUM: 2B &amp; HB GRAPHITE ON 300GSM CHARCOAL RAG
    </text>
  </g>

  
  <g filter="url(#pencil)">
    <text x="622" y="84" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="9.5" fill="#8C8982" letter-spacing="1.5">
      FIG 01 — INTERFACE WIREFRAME
    </text>

    
    <polygon points="646,108 836,108 836,226 646,226" fill="url(#hatch)" stroke="#68655E" stroke-width="0.9" />

    
    <rect x="632" y="120" width="190" height="118" fill="#151514" stroke="#D6D3CD" stroke-width="1.25" />
    <line x1="632" y1="138" x2="822" y2="138" stroke="#9A978F" stroke-width="0.9" />
    <circle cx="644" cy="129" r="2.2" fill="none" stroke="#B5B2AA" stroke-width="0.9" />
    <circle cx="653" cy="129" r="2.2" fill="none" stroke="#B5B2AA" stroke-width="0.9" />
    <circle cx="662" cy="129" r="2.2" fill="none" stroke="#B5B2AA" stroke-width="0.9" />

    
    <rect x="644" y="148" width="72" height="78" fill="url(#hatch)" stroke="#8E8B83" stroke-width="0.9" />
    <rect x="726" y="148" width="84" height="34" fill="none" stroke="#B8B4AC" stroke-width="0.9" />
    <rect x="726" y="190" width="84" height="36" fill="none" stroke="#7A7770" stroke-width="0.9" />
    <line x1="734" y1="160" x2="796" y2="160" stroke="#B8B4AC" stroke-width="0.9" />
    <line x1="734" y1="170" x2="780" y2="170" stroke="#6E6B64" stroke-width="0.8" />
    <line x1="734" y1="204" x2="792" y2="204" stroke="#8C8982" stroke-width="0.8" />
    <line x1="734" y1="214" x2="770" y2="214" stroke="#5A5852" stroke-width="0.8" />

    
    <line x1="632" y1="256" x2="822" y2="256" stroke="#7A7770" stroke-width="0.8" />
    <line x1="632" y1="250" x2="632" y2="262" stroke="#9E9B93" stroke-width="0.9" />
    <line x1="822" y1="250" x2="822" y2="262" stroke="#9E9B93" stroke-width="0.9" />
    <text x="727" y="274" text-anchor="middle" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="9.5" fill="#9E9B93" letter-spacing="1.4">
      RESPONSIVE · ACCESSIBLE · 1:1
    </text>
  </g>

  
  <g font-family="&#39;Courier New&#39;, Courier, monospace" font-size="10" fill="#8A8780" letter-spacing="1.5">
    <text x="50" y="330">SHEET 01 OF 06  ·  HEADER PLATE</text>
    <text x="850" y="330" text-anchor="end">CONTINUED BELOW ↓</text>
  </g>
</svg>
