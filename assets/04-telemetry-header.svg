<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 116" width="900" height="116">
  <defs>
    <filter id="paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" seed="52" result="n" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.09 0" in="n" result="mn" />
      <feComposite in="mn" in2="SourceGraphic" operator="over" />
    </filter>
    <filter id="pencil" x="-4%" y="-6%" width="108%" height="112%">
      <feTurbulence type="turbulence" baseFrequency="0.045" numOctaves="3" seed="52" result="t" />
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E1E1C" stroke-width="0.7" />
    </pattern>
  </defs>

  <rect width="900" height="116" fill="#141413" />
  <rect x="24" y="0" width="852" height="106" fill="url(#grid)" />
  <rect width="900" height="116" fill="#141413" opacity="0.35" filter="url(#paper)" />

  <g filter="url(#pencil)" fill="none" stroke-linecap="round">
    
    <path d="M 24 0 L 24 106 L 876 106 L 876 0" stroke="#7A7770" stroke-width="1.2" />
    <path d="M 30 0 L 30 100 L 870 100 L 870 0" stroke="#42403B" stroke-width="0.7" />

    
    <line x1="56" y1="24" x2="430" y2="24" stroke="#5A5852" stroke-width="1" />
    <line x1="470" y1="24" x2="844" y2="24" stroke="#5A5852" stroke-width="1" />
    <polygon points="450,15 461,24 450,33 439,24" stroke="#D6D3CD" stroke-width="1.1" fill="#141413" />
    <circle cx="450" cy="24" r="1.8" fill="#D6D3CD" />
  </g>

  <text x="56" y="66" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="13" font-weight="bold" fill="#EAE7DF" letter-spacing="2.2">
    IV.  TELEMETRY  —  GITHUB SIGNAL
  </text>
  <text x="844" y="66" text-anchor="end" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="10" fill="#8C8982" letter-spacing="1.4">
    [ LIVE FEED · @HUZZUH ]
  </text>
  <text x="56" y="88" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="10.5" fill="#9E9B93" letter-spacing="1.2">
    APERTURE 02  //  LIVE COMMIT STATS &amp; LANGUAGE DISTRIBUTION MOUNTED BELOW ↓
  </text>
</svg>
