<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350">
  <defs>
    
    <linearGradient id="paper-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141413" />
      <stop offset="50%" stop-color="#181817" />
      <stop offset="100%" stop-color="#111110" />
    </linearGradient>

    <radialGradient id="paper-vignette" cx="45%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </radialGradient>

    
    <linearGradient id="graphite-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C8982" />
      <stop offset="35%" stop-color="#DCD9D0" />
      <stop offset="75%" stop-color="#B8B4AC" />
      <stop offset="100%" stop-color="#75726C" />
    </linearGradient>

    
    <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="14" result="noise" />
      <feColorMatrix type="matrix" values="
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0    0    0    0.11 0" in="noise" result="monoNoise" />
      <feComposite in="monoNoise" in2="SourceGraphic" operator="over" />
    </filter>

    
    <filter id="pencil-wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.045" numOctaves="3" seed="7" result="turb" />
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="2.1" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    
    <pattern id="draft-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#262624" stroke-width="0.6" />
    </pattern>

    
    <pattern id="pencil-hatch" width="7" height="7" patternTransform="rotate(38)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#6E6B64" stroke-width="0.9" opacity="0.55" />
    </pattern>
  </defs>

  
  <rect width="900" height="350" fill="url(#paper-base)" />
  <rect x="24" y="20" width="852" height="310" fill="url(#draft-grid)" opacity="0.55" />
  <rect width="900" height="350" fill="url(#paper-vignette)" />

  
  <rect width="900" height="350" fill="#161615" opacity="0.35" filter="url(#paper-grain)" />

  
