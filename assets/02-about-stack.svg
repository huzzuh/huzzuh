<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665">
  <defs>
    <filter id="paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" seed="22" result="n" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.09 0" in="n" result="mn" />
      <feComposite in="mn" in2="SourceGraphic" operator="over" />
    </filter>

    <filter id="pencil" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="turbulence" baseFrequency="0.045" numOctaves="3" seed="13" result="t" />
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.9" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E1E1C" stroke-width="0.7" />
    </pattern>

    <pattern id="hatch" width="6" height="6" patternTransform="rotate(38)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#6E6B64" stroke-width="0.85" opacity="0.55" />
    </pattern>
  </defs>

  <rect width="900" height="665" fill="#141413" />
  <rect x="24" y="0" width="852" height="665" fill="url(#grid)" />
  <rect width="900" height="665" fill="#141413" opacity="0.35" filter="url(#paper)" />

  
  <g filter="url(#pencil)" fill="none" stroke-linecap="round">
    <line x1="24" y1="0" x2="24" y2="665" stroke="#7A7770" stroke-width="1.2" />
    <line x1="30" y1="0" x2="30" y2="665" stroke="#42403B" stroke-width="0.7" />
    <line x1="876" y1="0" x2="876" y2="665" stroke="#7A7770" stroke-width="1.2" />
    <line x1="870" y1="0" x2="870" y2="665" stroke="#42403B" stroke-width="0.7" />

    
    <path d="M 24 40 H 35 M 24 120 H 35 M 24 200 H 35 M 24 280 H 35 M 24 360 H 35 M 24 440 H 35 M 24 520 H 35 M 24 600 H 35" stroke="#6E6B64" stroke-width="0.9" />
  </g>

  
  <g>
    <text x="56" y="42" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="13" font-weight="bold" fill="#EAE7DF" letter-spacing="2.2">
      I.  FIELD NOTES  —  ABOUT
    </text>
    <text x="844" y="42" text-anchor="end" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="10" fill="#7A7770" letter-spacing="1.4">
      [ BIO &amp; FOCUS ]
    </text>

    <g filter="url(#pencil)">
      <line x1="56" y1="54" x2="844" y2="54" stroke="#6E6B64" stroke-width="1" />
      <line x1="56" y1="58" x2="290" y2="58" stroke="#474540" stroke-width="0.7" />

      
      <rect x="61" y="76" width="783" height="48" fill="url(#hatch)" opacity="0.45" />
      <rect x="56" y="72" width="788" height="48" fill="#181816" stroke="#6E6B64" stroke-width="0.9" />
      <line x1="56" y1="72" x2="56" y2="120" stroke="#D6D3CD" stroke-width="2.4" />
    </g>

    <text x="74" y="101" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="14" font-style="italic" fill="#DDD9D0">
      "Care for the details that make an interface feel right: clean components, sensible interactions, and fast load times."
    </text>

    
    <g font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="14.5" fill="#C4C0B8">
      <text x="56" y="152">
        Frontend developer and <tspan fill="#EAE7DF" font-weight="bold">B.Tech Computer Science</tspan> student at <tspan fill="#EAE7DF" font-weight="bold">SISTec GN, Bhopal</tspan>. I build
      </text>
      <text x="56" y="176">
        responsive, accessible interfaces with <tspan fill="#EAE7DF" font-weight="bold">React</tspan>, <tspan fill="#EAE7DF" font-weight="bold">Tailwind CSS</tspan>, and <tspan fill="#EAE7DF" font-weight="bold">JavaScript</tspan> — focused on craft.
      </text>
      <text x="56" y="210">
        I got hands-on experience on a <tspan fill="#EAE7DF" font-weight="bold">production-grade AI learning platform</tspan>, working across notes,
      </text>
      <text x="56" y="234">
        flashcards, and chat modules. Now working toward a <tspan fill="#EAE7DF" font-weight="bold">Software Engineering</tspan> role, always looking to learn next.
      </text>
    </g>

    
    <g filter="url(#pencil)" fill="none">
      <rect x="56" y="256" width="788" height="66" stroke="#5A5852" stroke-width="0.9" />
      <line x1="56" y1="289" x2="844" y2="289" stroke="#3F3E39" stroke-width="0.8" />
      <line x1="176" y1="256" x2="176" y2="322" stroke="#3F3E39" stroke-width="0.8" />
    </g>

    <g font-family="&#39;Courier New&#39;, Courier, monospace" font-size="11.5">
      <text x="70" y="277" fill="#8C8982" font-weight="bold" letter-spacing="1.4">BASED IN</text>
      <text x="194" y="277" fill="#E6E3DC">Bhopal, India</text>

      <text x="70" y="310" fill="#8C8982" font-weight="bold" letter-spacing="1.4">INTERESTS</text>
      <text x="194" y="310" fill="#D6D3CD">Software craftsmanship · Open source · Modern frontend architecture · AI-integrated apps</text>
    </g>
  </g>

  
  <g filter="url(#pencil)" fill="none">
    <line x1="56" y1="362" x2="430" y2="362" stroke="#5A5852" stroke-width="1" />
    <line x1="470" y1="362" x2="844" y2="362" stroke="#5A5852" stroke-width="1" />
    <polygon points="450,353 461,362 450,371 439,362" stroke="#D6D3CD" stroke-width="1.1" fill="#141413" />
    <circle cx="450" cy="362" r="1.8" fill="#D6D3CD" />
  </g>

  
  <g>
    <text x="56" y="408" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="13" font-weight="bold" fill="#EAE7DF" letter-spacing="2.2">
      II.  INSTRUMENT TRAY  —  STACK &amp; CONCEPTS
    </text>
    <text x="844" y="408" text-anchor="end" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="10" fill="#7A7770" letter-spacing="1.4">
      [ 10 INSTRUMENTS ]
    </text>

    <g filter="url(#pencil)">
      <line x1="56" y1="420" x2="844" y2="420" stroke="#6E6B64" stroke-width="1" />
    </g>

    
    <text x="56" y="460" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="10.5" fill="#8C8982" letter-spacing="1.4">INTERFACE</text>

    <g filter="url(#pencil)">
      
      <rect x="174" y="443" width="118" height="30" fill="url(#hatch)" />
      <rect x="170" y="439" width="118" height="30" fill="#191917" stroke="#BDBAB2" stroke-width="1" />
      
      <rect x="308" y="443" width="154" height="30" fill="url(#hatch)" />
      <rect x="304" y="439" width="154" height="30" fill="#191917" stroke="#BDBAB2" stroke-width="1" />
      
      <rect x="478" y="443" width="114" height="30" fill="url(#hatch)" />
      <rect x="474" y="439" width="114" height="30" fill="#191917" stroke="#8C8982" stroke-width="1" />
      
      <rect x="608" y="443" width="106" height="30" fill="url(#hatch)" />
      <rect x="604" y="439" width="106" height="30" fill="#191917" stroke="#8C8982" stroke-width="1" />
    </g>
    <g font-family="&#39;Courier New&#39;, Courier, monospace" font-size="12" font-weight="bold" fill="#EAE7DF" text-anchor="middle">
      <text x="229" y="458">REACT</text>
      <text x="381" y="458">TAILWIND CSS</text>
      <text x="531" y="458">HTML5</text>
      <text x="657" y="458">CSS3</text>
    </g>

    
    <text x="56" y="514" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="10.5" fill="#8C8982" letter-spacing="1.4">LANGUAGES</text>

    <g filter="url(#pencil)">
      
      <rect x="174" y="497" width="138" height="30" fill="url(#hatch)" />
      <rect x="170" y="493" width="138" height="30" fill="#191917" stroke="#BDBAB2" stroke-width="1" />
      
      <rect x="328" y="497" width="138" height="30" fill="url(#hatch)" />
      <rect x="324" y="493" width="138" height="30" fill="#191917" stroke="#BDBAB2" stroke-width="1" />
      
      <rect x="482" y="497" width="104" height="30" fill="url(#hatch)" />
      <rect x="478" y="493" width="104" height="30" fill="#191917" stroke="#8C8982" stroke-width="1" />
      
      <rect x="602" y="497" width="118" height="30" fill="url(#hatch)" />
      <rect x="598" y="493" width="118" height="30" fill="#191917" stroke="#8C8982" stroke-width="1" />
    </g>
    <g font-family="&#39;Courier New&#39;, Courier, monospace" font-size="12" font-weight="bold" fill="#EAE7DF" text-anchor="middle">
      <text x="239" y="512">JAVASCRIPT</text>
      <text x="393" y="512">TYPESCRIPT</text>
      <text x="530" y="512">JAVA</text>
      <text x="657" y="512">PYTHON</text>
    </g>

    
    <text x="56" y="568" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="10.5" fill="#8C8982" letter-spacing="1.4">WORKFLOW</text>

    <g filter="url(#pencil)">
      <rect x="174" y="551" width="100" height="30" fill="url(#hatch)" />
      <rect x="170" y="547" width="100" height="30" fill="#191917" stroke="#8C8982" stroke-width="1" />
      <rect x="290" y="551" width="118" height="30" fill="url(#hatch)" />
      <rect x="286" y="547" width="118" height="30" fill="#191917" stroke="#8C8982" stroke-width="1" />
    </g>
    <g font-family="&#39;Courier New&#39;, Courier, monospace" font-size="12" font-weight="bold" fill="#EAE7DF" text-anchor="middle">
      <text x="220" y="566">GIT</text>
      <text x="345" y="566">GITHUB</text>
    </g>

    
    <g filter="url(#pencil)">
      <rect x="56" y="604" width="788" height="38" fill="#181816" stroke="#5A5852" stroke-width="0.9" stroke-dasharray="6 3" />
    </g>
    <text x="72" y="627" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="11.5" fill="#D6D3CD">
      <tspan fill="#8C8982" font-weight="bold">CONCEPTS // </tspan>Responsive web design · REST API integration · Component-based architecture · Version control
    </text>
  </g>
</svg>
